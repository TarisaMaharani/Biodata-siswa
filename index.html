<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biodata Siswa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
  <style>
    :root { --bg: #eef2f7; --kartu: #fff; --teks: #14213d; --teks-redup: #5b667a; --garis: #d6dde8; --aksen: #1d4ed8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--teks); padding: 2rem 1rem; }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.25rem; }
    .sub { color: var(--teks-redup); margin-bottom: 2rem; }
    .filter-box { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .filter-box input, select { padding: 0.75rem 1rem; border: 1px solid var(--garis); border-radius: 8px; background: var(--kartu); color: var(--teks); font-size: 0.95rem; outline: none; }
    .filter-box input { flex: 1; min-width: 200px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .card { background: var(--kartu); border: 1px solid var(--garis); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--aksen); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem; }
    .card h3 { font-size: 1.15rem; margin-bottom: 0.25rem; }
    .kelas { background: var(--bg); color: var(--aksen); font-weight: 600; font-size: 0.8rem; padding: 0.25rem 0.75rem; border-radius: 20px; margin-bottom: 1rem; }
    .info { font-size: 0.85rem; color: var(--teks-redup); text-align: left; width: 100%; }
    .info p { margin-bottom: 0.4rem; }
    .pesan { grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--teks-redup); font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Biodata Siswa</h1>
    <p class="sub">Daftar siswa kelas 11 TJKT 1 dan 11 TJKT 2</p>
    <div class="filter-box">
      <input type="text" id="pencarian" placeholder="Cari nama atau NIS...">
      <select id="filterKelas">
        <option value="">Semua kelas</option>
        <option value="11 TJKT 1">11 TJKT 1</option>
        <option value="11 TJKT 2">11 TJKT 2</option>
      </select>
    </div>
    <div id="daftarSiswa" class="grid"><div class="pesan">Sedang memuat data siswa...</div></div>
  </div>

  <script>
    const SUPABASE_URL = "https://tchfltkkliadtobzcvhb.supabase.co/rest/v1/siswa?select=*";
    const SUPABASE_KEY = "sb_publishable_qsphmMKg2RStlOeNKL2ztw_Ize_T-3r";
    let dataSiswa = [];

    async function ambilDataSiswa() {
      try {
        const response = await fetch(SUPABASE_URL, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        if (!response.ok) throw new Error("Gagal mengambil data");
        
        dataSiswa = await response.json();
        tampilkanData(dataSiswa);
      } catch (err) {
        console.error(err);
        document.getElementById('daftarSiswa').innerHTML = '<div class="pesan">⚠️ Gagal memuat data dari Supabase. Coba refresh beberapa saat lagi.</div>';
      }
    }

    function tampilkanData(list) {
      const kontainer = document.getElementById('daftarSiswa');
      if (!list || list.length === 0) {
        kontainer.innerHTML = '<div class="pesan">Tidak ada data siswa yang ditemukan.</div>';
        return;
      }

      kontainer.innerHTML = list.map(s => `
        <div class="card">
          <div class="avatar">${s.nama ? s.nama.split(' ').map(n => n[0]).join('').substring(0, 3).toUpperCase() : 'S'}</div>
          <h3>${s.nama || '-'}</h3>
          <span class="kelas">${s.kelas || '-'}</span>
          <div class="info">
            <p><strong>NIS:</strong> ${s.nis || '-'}</p>
            <p><strong>Kelamin:</strong> ${s.jenis_kelamin || '-'}</p>
            <p><strong>Lahir:</strong> ${s.tanggal_lahir || '-'}</p>
            <p><strong>Alamat:</strong> ${s.alamat || '-'}</p>
          </div>
        </div>
      `).join('');
    }

    function filterDanCari() {
      const keyword = document.getElementById('pencarian').value.toLowerCase();
      const kelasPilihan = document.getElementById('filterKelas').value;

      const hasilFilter = dataSiswa.filter(s => {
        const cocokNamaNis = (s.nama && s.nama.toLowerCase().includes(keyword)) || (s.nis && s.nis.toString().includes(keyword));
        const cocokKelas = !kelasPilihan || s.kelas === kelasPilihan;
        return cocokNamaNis && cocokKelas;
      });

      tampilkanData(hasilFilter);
    }

    document.getElementById('pencarian').addEventListener('input', filterDanCari);
    document.getElementById('filterKelas').addEventListener('change', filterDanCari);

    ambilDataSiswa();
  </script>
</body>
</html>
