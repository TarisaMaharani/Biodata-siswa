<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biodata Siswa</title>
  <!-- Font Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef2f7;
      --kartu: #ffffff;
      --teks: #14213d;
      --teks-redup: #5b667a;
      --garis: #d6dde8;
      --aksen: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1522;
        --kartu: #172133;
        --teks: #e2e8f0;
        --teks-redup: #94a3b8;
        --garis: #2a364f;
        --aksen: #3b82f6;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--teks);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--teks);
    }
    p.sub {
      color: var(--teks-redup);
      margin-top: 0.25rem;
    }
    .filter-box {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filter-box input, .filter-box select {
      padding: 0.75rem 1rem;
      border: 1px solid var(--garis);
      border-radius: 8px;
      background: var(--kartu);
      color: var(--teks);
      font-size: 0.95rem;
      outline: none;
    }
    .filter-box input {
      flex: 1;
      min-width: 200px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--kartu);
      border: 1px solid var(--garis);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s;
    }
    .
